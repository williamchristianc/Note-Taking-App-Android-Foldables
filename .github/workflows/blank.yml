
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Folio.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Folio project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/folio-src"
          unzip -q Folio.zip -d "$RUNNER_TEMP/folio-src"

          PROJECT_DIR="$RUNNER_TEMP/folio-src/Folio"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project contents:"
          ls -la "$PROJECT_DIR"

          echo "Root Gradle configuration:"
          cat "$PROJECT_DIR/build.gradle.kts"

          echo "App Gradle configuration:"
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build Folio APK
        shell: bash
        run: |
          set +e
          set -o pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/folio-build.log"

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "=== IMPORTANT BUILD ERRORS ==="

            grep -nEi \
              '(^e: |error:|what went wrong|failed|unresolved reference|could not resolve|could not find|plugin .*not found)' \
              "$GITHUB_WORKSPACE/folio-build.log" \
              | head -n 60 || true
          fi

          exit "$RESULT"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-build-log
          path: folio-build.log
          if-no-files-found: ignore

      - name: Upload Folio APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
