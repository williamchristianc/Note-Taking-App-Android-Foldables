name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP=$(find . -name Folio.zip -not -path './.git/*' | head -n1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d /tmp/proj
          ls /tmp/proj/Folio
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd /tmp/proj/Folio && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: /tmp/proj/Folio/app/build/outputs/apk/debug/app-debug.apk
