name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: '**/outputs/apk/debug/app-debug.apk'
