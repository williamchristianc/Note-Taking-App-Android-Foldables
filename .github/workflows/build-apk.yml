name: Build Folio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Folio.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Folio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/folio-src"
          unzip -q Folio.zip -d "$RUNNER_TEMP/folio-src"
          echo "FOLIO_DIR=$RUNNER_TEMP/folio-src/Folio" >> "$GITHUB_ENV"
          test -f "$RUNNER_TEMP/folio-src/Folio/settings.gradle.kts"
          test -f "$RUNNER_TEMP/folio-src/Folio/app/build.gradle.kts"
          echo 'Folio extracted successfully'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$FOLIO_DIR"
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/folio-build.log"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-build-log
          path: folio-build.log
          if-no-files-found: ignore

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: ${{ env.FOLIO_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
